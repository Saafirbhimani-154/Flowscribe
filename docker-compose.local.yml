version: '3.8'
services:
  frontend:
    env_file: .env.local
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: builder
    ports:
      - '7000:7000'
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - PORT=7000
      - CHOKIDAR_USEPOLLING=true
    command: npm run dev -- --host --port 7000
    depends_on:
      - middleware

  middleware:
    env_file: .env.local
    build:
      context: ./middleware
      dockerfile: Dockerfile
    ports:
      - '6001:6001'
    volumes:
      - ./middleware:/app
      - /app/node_modules
      - /app/.next
    environment:
      - NODE_ENV=development
      - PORT=6001
      - WATCHPACK_POLLING=true
    command: sh -c "npm i @next/swc-linux-x64-gnu@16.2.12 && npm run dev"
    depends_on:
      - backend

  backend:
    env_file: ./backend/.env.local
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - '5000:5000'
    volumes:
      - ./backend:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - PORT=5000
    depends_on:
      - db
    command: sh -c "npx tsx src/database/run_migrations.ts && npm run dev"

  db:
    container_name: flowscribe_postgres_local
    env_file: .env.local
    image: postgres:15-alpine
    ports:
      - '54322:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    container_name: flowscribe_redis_local
    env_file: .env.local
    image: redis:7-alpine
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data

  pgadmin:
    container_name: flowscribe_pgadmin
    image: dpage/pgadmin4
    env_file: .env.local
    ports:
      - '5050:80'
    depends_on:
      - db
    volumes:
      - pgadmin_data:/var/lib/pgadmin

volumes:
  postgres_data:
  redis_data:
  pgadmin_data:
