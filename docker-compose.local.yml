version: '3.8'
services:
  frontend:
    env_file: .env.local
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - '7000:7000'
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - PORT=7000
    depends_on:
      - middleware

  middleware:
    env_file: .env.local
    build:
      context: ./middleware
      dockerfile: Dockerfile
    ports:
      - '6000:6000'
    volumes:
      - ./middleware:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - PORT=6000
    depends_on:
      - backend

  backend:
    env_file: ./backend/.env.local
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - '5000:5000'
    volumes:
      - ./backend:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - PORT=5000
      - DATABASE_URL="${DATABASE_URL}"
    depends_on:
      - db
    command: sh -c "npx tsx src/database/run_migrations.ts && npm run dev"

  db:
    container_name: flowscribe_postgres_local
    env_file: .env.local
    image: postgres:15-alpine
    ports:
      - '54322:5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
